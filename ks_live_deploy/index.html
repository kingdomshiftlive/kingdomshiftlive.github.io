<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<meta name="theme-color" content="#070707"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="KingdomShift"/>
<link rel="manifest" href="./manifest.json"/>
<link rel="icon" href="./logo.png"/>
<link rel="apple-touch-icon" href="./logo.png"/>
<title>KingdomShift.Live — Stream With Purpose</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Montserrat:wght@300;400;500;600;700;800&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Stripe -->
<script src="https://js.stripe.com/v3/"></script>
<!-- ZegoCloud -->
<script src="https://unpkg.com/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --teal:#00C9C8;--teal2:#00E5E4;--tealD:#007878;
  --gold:#C9A227;--gold2:#E8BC3A;--gold3:#F5D060;
  --pink:#E91E8C;--pink2:#FF4DB8;
  --black:#070707;--dark:#0A0A0A;--dark2:#0D0D0F;
  --card:#111114;--card2:#161619;
  --glass:rgba(255,255,255,.04);--glassTeal:rgba(0,201,200,.06);
  --border:rgba(0,201,200,.12);--borderG:rgba(201,162,39,.15);
  --text:#F2EFE8;--muted:#8A9AAA;--dim:#445560;
  --green:#1DB954;--red:#FF4444;--purple:#9B59B6;
}
html,body{height:100%;overflow:hidden;background:var(--black);color:var(--text);font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--teal),var(--gold));border-radius:2px;}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes giftFloat{0%{transform:translateY(0) scale(1);opacity:1}70%{transform:translateY(-320px) scale(1.05);opacity:1}100%{transform:translateY(-440px) scale(.6);opacity:0}}
@keyframes legendaryIn{0%{opacity:0;transform:scale(.3) rotate(-15deg)}25%{opacity:1;transform:scale(1.2) rotate(5deg)}60%{transform:scale(1) rotate(0)}100%{opacity:0;transform:scale(1.3)}}
@keyframes toastPop{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.3}}

.shimmer-text{background:linear-gradient(90deg,var(--gold),var(--gold3),var(--teal2),var(--gold));background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 4s linear infinite;}

/* ── LAYOUT ── */
.app{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:230px;flex-shrink:0;background:linear-gradient(180deg,#0A0C0C,#090909);border-right:1px solid var(--border);display:flex;flex-direction:column;position:relative;overflow:hidden;}
.sidebar::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--teal),transparent);}
.sb-top{padding:18px 16px 14px;border-bottom:1px solid var(--border);}
.sb-brand{display:flex;align-items:center;gap:10px;}
.sb-logo{width:36px;height:36px;border-radius:9px;overflow:hidden;border:1px solid rgba(0,201,200,.3);box-shadow:0 0 20px rgba(0,201,200,.2);flex-shrink:0;}
.sb-logo img{width:100%;height:100%;object-fit:cover;}
.sb-name{font-family:'Playfair Display',serif;font-size:13px;font-weight:700;background:linear-gradient(135deg,var(--teal),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2;}
.sb-tagline{font-size:8px;color:var(--teal);letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-top:2px;}
.sb-nav{flex:1;padding:10px 8px;overflow-y:auto;}
.sb-nav::-webkit-scrollbar{display:none;}
.sb-section{font-size:9px;font-weight:700;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;padding:10px 8px 5px;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:all .2s;margin-bottom:2px;position:relative;}
.sb-item:hover{background:var(--glassTeal);}
.sb-item.active{background:linear-gradient(135deg,rgba(0,201,200,.1),rgba(201,162,39,.06));border:1px solid rgba(0,201,200,.2);}
.sb-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:2px;border-radius:1px;background:linear-gradient(var(--teal),var(--gold));}
.sb-icon{font-size:17px;width:22px;text-align:center;flex-shrink:0;}
.sb-label{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;}
.sb-item.active .sb-label{color:var(--teal);}
.sb-badge{margin-left:auto;background:var(--pink);border-radius:100px;padding:1px 7px;font-size:9px;font-weight:700;color:#fff;}
.sb-badge.gold{background:var(--gold);color:var(--black);}
.sb-footer{padding:12px;border-top:1px solid var(--border);}
.sb-user{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;background:var(--glass);border:1px solid var(--border);transition:all .2s;}
.sb-user:hover{border-color:rgba(0,201,200,.3);}
.sb-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--gold));display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.sb-uname{font-size:11px;font-weight:700;color:var(--text);}
.sb-ustatus{font-size:10px;color:var(--teal);}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:52px;flex-shrink:0;background:rgba(7,7,7,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:10px;position:relative;z-index:10;}
.topbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--teal),transparent);opacity:.3;}
.tb-menu{display:none;width:32px;height:32px;border-radius:8px;background:var(--glass);border:1px solid var(--border);align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:var(--muted);transition:all .2s;}
.tb-title{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;background:linear-gradient(90deg,var(--teal),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.tb-right{display:flex;gap:7px;align-items:center;margin-left:auto;}
.tb-btn{width:32px;height:32px;border-radius:8px;background:var(--glass);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:all .2s;position:relative;}
.tb-btn:hover{border-color:var(--teal);}
.tb-notif{position:absolute;top:-3px;right:-3px;width:13px;height:13px;border-radius:50%;background:var(--pink);border:2px solid var(--black);font-size:7px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;}
.live-tag{display:flex;align-items:center;gap:5px;background:rgba(233,30,140,.1);border:1px solid rgba(233,30,140,.3);border-radius:20px;padding:4px 10px;font-size:10px;font-weight:700;color:var(--pink);letter-spacing:.06em;}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--pink);animation:blink 1s ease infinite;}

.page{flex:1;overflow-y:auto;overflow-x:hidden;}
.page::-webkit-scrollbar{width:3px;}

.bottom-nav{display:none;background:rgba(7,7,7,.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);flex-shrink:0;}
.bn-row{display:flex;padding-bottom:env(safe-area-inset-bottom,0);}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 4px;cursor:pointer;opacity:.4;transition:all .2s;}
.bn-item.active{opacity:1;}
.bn-item.active .bn-label{color:var(--teal);}
.bn-icon{font-size:20px;line-height:1;}
.bn-label{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.04em;}
.bn-pip{width:3px;height:3px;border-radius:50%;background:var(--teal);box-shadow:0 0 6px var(--teal);}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;backdrop-filter:blur(4px);}
.overlay.open{display:block;}
.drawer{position:fixed;top:0;left:-240px;width:240px;height:100%;background:linear-gradient(180deg,#0A0C0C,#090909);border-right:1px solid var(--border);z-index:201;transition:left .3s ease;overflow-y:auto;}
.drawer.open{left:0;}

.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--teal),var(--gold));color:var(--black);padding:9px 22px;border-radius:24px;font-size:12px;font-weight:700;letter-spacing:.04em;white-space:nowrap;z-index:9999;pointer-events:none;animation:toastPop .3s ease;box-shadow:0 8px 32px rgba(0,201,200,.4);}

@media(max-width:900px){
  .sidebar{display:none;}
  .tb-menu{display:flex;}
  .bottom-nav{display:block;}
}

/* ── AUTH ── */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse 80% 60% at 50% 40%,#0A1010,var(--black));}
.auth-card{background:#0C0C10;border:1px solid rgba(0,201,200,.2);border-radius:20px;padding:36px;max-width:400px;width:100%;box-shadow:0 40px 80px rgba(0,0,0,.8),0 0 80px rgba(0,201,200,.08);}
.auth-logo{width:60px;height:60px;border-radius:14px;overflow:hidden;border:1px solid rgba(0,201,200,.3);box-shadow:0 0 30px rgba(0,201,200,.2);margin:0 auto 16px;}
.auth-logo img{width:100%;height:100%;object-fit:cover;}
.auth-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;text-align:center;background:linear-gradient(90deg,var(--teal),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px;}
.auth-sub{font-size:12px;color:var(--muted);text-align:center;margin-bottom:24px;}
.auth-field{margin-bottom:14px;}
.auth-label{font-size:9px;font-weight:700;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:6px;}
.auth-input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:13px;font-family:'Montserrat',sans-serif;outline:none;transition:border .2s;}
.auth-input:focus{border-color:rgba(0,201,200,.5);}
.auth-input::placeholder{color:var(--dim);}
.auth-btn{width:100%;background:linear-gradient(135deg,var(--teal),var(--gold) 180%);color:var(--black);border:none;border-radius:10px;padding:14px;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:all .25s;box-shadow:0 6px 24px rgba(0,201,200,.25);}
.auth-btn:hover{box-shadow:0 12px 36px rgba(0,201,200,.4);transform:translateY(-1px);}
.auth-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--muted);}
.auth-switch a{color:var(--teal);cursor:pointer;font-weight:700;}
.auth-error{background:rgba(255,68,68,.08);border:1px solid rgba(255,68,68,.2);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--red);margin-bottom:14px;display:none;}
.auth-promise{background:rgba(0,201,200,.04);border:1px solid rgba(0,201,200,.1);border-radius:10px;padding:12px;margin-top:16px;font-size:11px;color:var(--dim);line-height:1.7;text-align:center;}

/* ── SHARED COMPONENTS ── */
.glass-card{background:var(--glass);border:1px solid var(--border);border-radius:16px;position:relative;overflow:hidden;}
.glass-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--teal),transparent);opacity:.4;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:10px;padding:11px 22px;cursor:pointer;border:none;transition:all .25s;}
.btn:active{transform:scale(.95);}
.btn-teal{background:linear-gradient(135deg,var(--teal),var(--tealD));color:var(--black);box-shadow:0 4px 20px rgba(0,201,200,.3);}
.btn-teal:hover{box-shadow:0 8px 32px rgba(0,201,200,.5);transform:translateY(-1px);}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--black);}
.btn-glass{background:var(--glass);color:var(--muted);border:1px solid var(--border);}
.btn-glass:hover{border-color:var(--teal);color:var(--teal);}
.btn-pink{background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;}
.btn-sm{padding:7px 14px;font-size:10px;border-radius:8px;}
.btn-full{width:100%;}
.toggle{width:44px;height:24px;border-radius:12px;cursor:pointer;position:relative;transition:background .2s;border:none;flex-shrink:0;}
.toggle.on{background:linear-gradient(135deg,var(--teal),var(--gold));}
.toggle.off{background:rgba(255,255,255,.1);}
.toggle-knob{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:3px;transition:left .2s;box-shadow:0 2px 6px rgba(0,0,0,.3);}
.toggle.on .toggle-knob{left:23px;}
.toggle.off .toggle-knob{left:3px;}
.input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-size:13px;font-family:'Montserrat',sans-serif;outline:none;transition:border .2s;}
.input:focus{border-color:rgba(0,201,200,.5);}
.input::placeholder{color:var(--dim);}
.label{font-size:9px;font-weight:700;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:6px;}
.page-hdr{padding:18px 16px 0;}
.page-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;margin-bottom:4px;}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:16px;font-weight:300;}
.sec-title{font-size:9px;font-weight:700;letter-spacing:.18em;color:var(--teal);text-transform:uppercase;margin-bottom:10px;}
.list-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:opacity .2s;}
.list-row:active{opacity:.6;}
.list-row:last-child{border-bottom:none;}
.back-bar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);}
.back-btn{width:32px;height:32px;border-radius:8px;background:var(--glass);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;color:var(--muted);transition:all .2s;}
.back-btn:hover{border-color:var(--teal);color:var(--teal);}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.tag-teal{background:rgba(0,201,200,.12);color:var(--teal);border:1px solid rgba(0,201,200,.2);}
.tag-gold{background:rgba(201,162,39,.12);color:var(--gold);border:1px solid rgba(201,162,39,.2);}
.tag-green{background:rgba(29,185,84,.12);color:var(--green);border:1px solid rgba(29,185,84,.2);}
.tag-red{background:rgba(255,68,68,.12);color:var(--red);border:1px solid rgba(255,68,68,.2);}
.tag-pink{background:rgba(233,30,140,.12);color:var(--pink);border:1px solid rgba(233,30,140,.2);}

/* ── FEED ── */
.stories-bar{display:flex;gap:10px;padding:12px 14px;overflow-x:auto;border-bottom:1px solid var(--border);}
.stories-bar::-webkit-scrollbar{display:none;}
.story{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;cursor:pointer;}
.story-ring{width:54px;height:54px;border-radius:50%;padding:2px;background:linear-gradient(135deg,var(--teal),var(--gold));}
.story-inner{width:100%;height:100%;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid var(--black);}
.story-name{font-size:9px;color:var(--muted);max-width:54px;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.feed-post{background:var(--card);border-bottom:1px solid var(--border);animation:fadeUp .4s ease both;}
.fp-header{padding:12px 14px 9px;display:flex;align-items:center;gap:10px;}
.fp-av{width:38px;height:38px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;border:1.5px solid rgba(0,201,200,.2);}
.fp-name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px;}
.fp-verified{color:var(--teal);font-size:11px;}
.fp-meta{font-size:11px;color:var(--muted);}
.fp-follow{font-size:11px;font-weight:700;padding:5px 14px;border-radius:20px;cursor:pointer;border:1px solid rgba(0,201,200,.3);background:transparent;color:var(--teal);transition:all .2s;font-family:'Montserrat',sans-serif;}
.fp-follow.on{background:rgba(0,201,200,.1);}
.fp-media{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,#0A1414,var(--card2));display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;overflow:hidden;}
.fp-play{width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);border:2px solid var(--teal);display:flex;align-items:center;justify-content:center;font-size:20px;transition:all .2s;}
.fp-media:hover .fp-play{transform:scale(1.1);box-shadow:0 0 30px rgba(0,201,200,.4);}
.fp-badge{position:absolute;border-radius:20px;padding:3px 10px;font-size:9px;font-weight:700;letter-spacing:.06em;}
.fp-live-badge{top:10px;left:10px;background:var(--pink);color:#fff;}
.fp-cat-badge{top:10px;right:10px;background:rgba(0,0,0,.75);color:var(--gold);border:1px solid rgba(201,162,39,.3);}
.fp-dur{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.75);border-radius:6px;padding:2px 8px;font-size:10px;color:#fff;}
.fp-text{padding:9px 14px;font-size:13px;line-height:1.65;font-weight:300;}
.fp-actions{padding:8px 14px 12px;display:flex;align-items:center;gap:14px;}
.fp-act{display:flex;align-items:center;gap:5px;background:none;border:none;cursor:pointer;font-size:11px;color:var(--muted);font-family:'Montserrat',sans-serif;transition:all .2s;}
.fp-act:active{transform:scale(.85);}
.fp-act-icon{font-size:18px;}
.fp-save{margin-left:auto;background:none;border:none;cursor:pointer;font-size:20px;transition:all .2s;}

/* ── LIVE ── */
.live-stage{height:calc(100vh - 52px);position:relative;overflow:hidden;background:radial-gradient(ellipse at 60% 40%,#0A1414,var(--black));}
.live-video-area{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.live-presenter{text-align:center;}
.live-presenter-icon{font-size:88px;animation:float 3s ease infinite;display:block;margin-bottom:10px;filter:drop-shadow(0 0 40px rgba(0,201,200,.3));}
.live-presenter-name{font-family:'Playfair Display',serif;font-size:16px;color:var(--teal);}
.live-presenter-topic{font-size:13px;color:var(--muted);margin-top:4px;font-style:italic;}
.live-top{position:absolute;top:0;left:0;right:0;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;}
.live-badges-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.live-badge{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);border-radius:20px;padding:5px 11px;font-size:10px;font-weight:700;}
.lb-live{background:var(--pink);color:#fff;}
.lb-viewers{color:var(--text);border:1px solid rgba(255,255,255,.1);}
.lb-coins{color:var(--gold);border:1px solid rgba(201,162,39,.3);cursor:pointer;}
.live-tg{position:absolute;top:54px;right:12px;display:flex;flex-direction:column;gap:5px;}
.tg-card{background:rgba(0,0,0,.7);backdrop-filter:blur(8px);border:1px solid rgba(0,201,200,.15);border-radius:20px;padding:5px 10px;display:flex;align-items:center;gap:6px;}
.tg-rank{font-size:12px;}
.tg-av{font-size:13px;}
.tg-nm{font-size:9px;color:var(--text);font-weight:700;}
.tg-coins{font-size:9px;color:var(--gold);}
.live-comments-area{position:absolute;bottom:156px;left:12px;right:76px;max-height:130px;overflow:hidden;display:flex;flex-direction:column;gap:4px;justify-content:flex-end;}
.live-comment{background:rgba(0,0,0,.7);backdrop-filter:blur(8px);border-radius:20px;padding:5px 12px;display:inline-flex;gap:6px;align-items:center;max-width:92%;}

.guide-step{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;display:flex;gap:12px;}

async function initAuth() {
  // Check existing session
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    S.user = session.user;
    await loadProfile();
    showApp();
  } else {
    showAuth('login');
  }
  document.getElementById('loading').style.display = 'none';

  // Listen for auth changes
  sb.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' && session) {
      S.user = session.user;
      await loadProfile();
      showApp();
    } else if (event === 'SIGNED_OUT') {
      S.user = null; S.profile = null;
      showAuth('login');
    }
  });
}

async function loadProfile() {
  try {
    const { data, error } = await sb
      .from('profiles')
      .select('*')
      .eq('id', S.user.id)
      .single();

    if (data) {
      S.profile = data;
      S.coins = data.coins || 0;
      S.isPro = data.is_pro || false;
      document.getElementById('sb-uname').textContent = data.display_name || data.username || 'Creator';
      document.getElementById('sb-av').textContent = data.avatar || '👤';
    } else {
      // Profile doesn't exist yet — create it
      await createProfile();
    }
  } catch (e) {
    console.log('Profile load:', e);
  }
}

async function createProfile() {
  const username = S.user.email.split('@')[0].replace(/[^a-z0-9_]/gi,'').toLowerCase();
  const { data } = await sb.from('profiles').insert({
    id: S.user.id,
    email: S.user.email,
    username: username,
    display_name: username,
    role: 'creator',
    tier: 'Seed',
    coins: 0,
    followers: 0,
    following: 0,
    is_pro: false,
  }).select().single();
  if (data) { S.profile = data; }
  document.getElementById('sb-uname').textContent = username;
}

async function handleSignUp() {
  if (S.authLoading) return;
  const email    = document.getElementById('af-email')?.value?.trim();
  const password = document.getElementById('af-pass')?.value;
  const username = document.getElementById('af-user')?.value?.trim();
  if (!email || !password || !username) { showAuthError('Please fill in all fields'); return; }
  if (password.length < 6) { showAuthError('Password must be at least 6 characters'); return; }
  setAuthLoading(true);
  const { error } = await sb.auth.signUp({
    email, password,
    options: { data: { username, display_name: username } }
  });
  setAuthLoading(false);
  if (error) { showAuthError(error.message); }
  else { showAuthError('✅ Check your email to confirm your account', true); }
}

async function handleSignIn() {
  if (S.authLoading) return;
  const email    = document.getElementById('af-email')?.value?.trim();
  const password = document.getElementById('af-pass')?.value;
  if (!email || !password) { showAuthError('Please enter your email and password'); return; }
  setAuthLoading(true);
  const { error } = await sb.auth.signInWithPassword({ email, password });
  setAuthLoading(false);
  if (error) { showAuthError(error.message); }
}

async function handleSignOut() {
  await sb.auth.signOut();
  showToast('Signed out');
}

function showAuthError(msg, isSuccess=false) {
  const el = document.getElementById('auth-error');
  el.style.display = 'block';
  el.style.color = isSuccess ? 'var(--green)' : 'var(--red)';
  el.style.background = isSuccess ? 'rgba(29,185,84,.08)' : 'rgba(255,68,68,.08)';
  el.style.borderColor = isSuccess ? 'rgba(29,185,84,.2)' : 'rgba(255,68,68,.2)';
  el.textContent = msg;
}

function setAuthLoading(v) {
  S.authLoading = v;
  const btn = document.getElementById('auth-submit-btn');
  if (btn) { btn.disabled = v; btn.textContent = v ? 'Please wait...' : (S.authMode==='login' ? 'Sign In →' : 'Create Free Account →'); }
}

function navigate(tab, subPage) {

  S.tab=tab; S.subPage=subPage||null; S.giftTrayOpen=false;
  updateNav(); render();

function updateNav() {
  const found = NAV_ITEMS.find(n=>n.id===S.tab);
  const title = S.subPage ? S.subPage.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()) : (found?.label||'KingdomShift.Live');
  document.getElementById('tb-title').textContent = title;
  document.getElementById('live-tag-wrap').style.display = S.tab==='live' ? 'block' : 'none';

  ['sb-nav','drawer-nav'].forEach(id=>{
    const el=document.getElementById(id); if(!el) return;
    let lastSec=null, html='';
    NAV_ITEMS.forEach(n=>{
      if(n.section&&n.section!==lastSec){html+=`<div class="sb-section">${n.section}</div>`;lastSec=n.section;}
      else if(!n.section){lastSec=null;}
      const active=S.tab===n.id&&!S.subPage;
      html+=`<div class="sb-item ${active?'active':''}" onclick="navigate('${n.id}')">
        <span class="sb-icon">${n.icon}</span>
        <span class="sb-label">${n.label}</span>
        ${n.id==='admin'?'<span class="sb-badge gold">ADMIN</span>':''}
      </div>`;
    });
    el.innerHTML=html;
  });

  const bn=document.getElementById('bn-row'); if(!bn) return;
  bn.innerHTML=MOBILE_NAV.map(n=>`
    <div class="bn-item ${S.tab===n.id?'active':''}" onclick="navigate('${n.id}')">
      <span class="bn-icon">${n.icon}</span>
      <span class="bn-label">${n.label}</span>
      ${S.tab===n.id?'<div class="bn-pip"></div>':''}
    </div>`).join('');
}

function toggleDrawer(force) {
  const ov=document.getElementById('drawer-overlay'), dr=document.getElementById('drawer');
  const open=force!==undefined?force:!dr.classList.contains('open');
  dr.classList.toggle('open',open); ov.classList.toggle('open',open);
}

async function fetchLiveStreams() {
  try {
    const { data } = await sb
      .from('live_streams')
      .select('*, profiles(display_name,username,avatar,verified)')
      .eq('status','live')

}

function sendComment(){const i=document.getElementById('li');if(!i||!i.value.trim())return;addComment('You',i.value.trim());i.value='';}
function addComment(u,t){const el=document.getElementById('live-comments');if(!el)return;const d=document.createElement('div');d.className='live-comment';d.innerHTML=`<span class="lc-user">${u}</span><span class="lc-text">${t}</span>`;el.appendChild(d);while(el.children.length>5)el.firstChild.remove();}
function toggleGiftTray(){S.giftTrayOpen=!S.giftTrayOpen;const w=document.getElementById('gift-tray-wrap');if(w)w.style.display=S.giftTrayOpen?'block':'none';}

function sendGift(name,icon,cost,color,sender){
  if(!sender){
    if(S.coins<cost){showToast('Not enough coins! Tap Buy to get more 🪙');showCoinsModal();return;}
    S.coins-=cost;
    const cn=document.getElementById('cn');if(cn)cn.textContent=S.coins;
    // Update coins in Supabase
    if(S.user){sb.from('profiles').update({coins:S.coins}).eq('id',S.user.id);}
  }
  const s=sender||{name:S.profile?.display_name||'You',avatar:'😊'};
  if(!S.topGifters[s.name])S.topGifters[s.name]={coins:0,avatar:s.avatar};
  S.topGifters[s.name].coins+=cost;
  updateTopGifters();
  S.viewerCount+=Math.floor(Math.random()*4+2);
  const vc=document.getElementById('vc');if(vc)vc.textContent=S.viewerCount.toLocaleString();
  addComment(s.name,`sent ${icon} ${name}!`);
  if(name==='GLORY'||name==='Kingdom')showLegendary(icon,name,s,color);
  else floatGift(icon,name,s,color);
  if(!sender)showToast(`${icon} ${name} sent!`);
}
function floatGift(icon,name,s,color){
  const ov=document.getElementById('gift-ov');if(!ov)return;
  const el=document.createElement('div');el.className='gift-float-card';
  el.style.cssText=`bottom:${150+Math.random()*50}px;left:${8+Math.random()*18}px;border-color:${color};`;
  el.innerHTML=`<div class="gfc-av">${s.avatar}</div><div><div class="gfc-sender">${s.name}</div><div class="gfc-msg" style="color:${color}">sent ${name}!</div></div><div class="gfc-emoji">${icon}</div>`;
  ov.appendChild(el);setTimeout(()=>el.remove(),3000);
}
function showLegendary(icon,name,s,color){
  const ov=document.getElementById('legend-ov');if(!ov)return;
  ov.innerHTML=`<div style="text-align:center;animation:legendaryIn 3.2s ease forwards;pointer-events:none;">
    <div style="font-size:96px;filter:drop-shadow(0 0 50px ${color});">${icon}</div>
    <div style="font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:${color};text-shadow:0 0 40px ${color};margin:8px 0;">${name.toUpperCase()}</div>
    <div style="background:rgba(0,0,0,.8);border:1px solid ${color}50;border-radius:20px;padding:8px 22px;display:inline-block;font-size:13px;">${s.avatar} ${s.name} sent this!</div>
  </div>`;
  floatGift(icon,name,s,color);
  setTimeout(()=>{const o=document.getElementById('legend-ov');if(o)o.innerHTML='';},3300);
}
function updateTopGifters(){
  const el=document.getElementById('live-tg');if(!el)return;
  const sorted=Object.entries(S.topGifters).sort((a,b)=>b[1].coins-a[1].coins).slice(0,3);
  el.innerHTML=sorted.map(([name,d],i)=>`<div class="tg-card"><span class="tg-rank">${['🥇','🥈','🥉'][i]}</span><span class="tg-av">${d.avatar}</span><div><div class="tg-nm">${name}</div><div class="tg-coins">🪙${d.coins.toLocaleString()}</div></div></div>`).join('');
}
function startGiftAuto(){
  stopGiftAuto();
  function drop(){if(S.tab!=='live')return;const g=GIFTS[Math.floor(Math.random()*(GIFTS.length-1))];const s=SENDERS[Math.floor(Math.random()*SENDERS.length)];sendGift(g.name,g.icon,g.coins,g.color,s);S.giftAuto=setTimeout(drop,1400+Math.random()*3200);}
  S.giftAuto=setTimeout(drop,1200);
}
function stopGiftAuto(){if(S.giftAuto){clearTimeout(S.giftAuto);S.giftAuto=null;}}
function startViewerUpdater(){const iv=setInterval(()=>{if(S.tab!=='live'){clearInterval(iv);return;}S.viewerCount+=Math.floor(Math.random()*7-2);if(S.viewerCount<1800)S.viewerCount=1800;const vc=document.getElementById('vc');if(vc)vc.textContent=S.viewerCount.toLocaleString();},3000);}

function selectPkg(id) {
  selectedPkg = COIN_PACKAGES.find(p=>p.id===id);
  document.querySelectorAll('.coin-pkg').forEach(el=>el.classList.remove('selected'));
  document.getElementById('pkg-'+id)?.classList.add('selected');
  const btn = document.getElementById('buy-btn');
  if(btn && selectedPkg) btn.textContent = `Buy ${selectedPkg.coins.toLocaleString()} coins for $${selectedPkg.price}`;
}

async function purchaseCoins() {
  if(!selectedPkg){ showToast('Please select a package'); return; }
  if(!S.user){ showToast('Please sign in first'); return; }
  // Stripe checkout — in production this calls your backend to create a checkout session
  showToast('🔗 Connecting to Stripe...');
  try {
    // This creates a Stripe checkout session via your backend
    // Developer: Create /api/create-checkout-session endpoint
    const response = await fetch('/api/create-checkout-session', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        package_id: selectedPkg.id,
        user_id: S.user.id,
        coins: selectedPkg.coins,
        price: selectedPkg.price,
      }),
    });
    const session = await response.json();
    if(session.url) {
      window.location.href = session.url;
    } else {
      // Demo mode — add coins directly
      S.coins += selectedPkg.coins;
      await sb.from('profiles').update({coins:S.coins}).eq('id',S.user.id);
      document.getElementById('coins-modal')?.remove();
      showToast(`✅ ${selectedPkg.coins.toLocaleString()} coins added!`);
      const cn=document.getElementById('cn');if(cn)cn.textContent=S.coins;
    }
  } catch(e) {
    // Demo mode
    S.coins += selectedPkg.coins;
    document.getElementById('coins-modal')?.remove();
    showToast(`✅ ${selectedPkg.coins.toLocaleString()} coins added! (demo mode)`);
    const cn=document.getElementById('cn');if(cn)cn.textContent=S.coins;
  }
}

function startBattle(id,name){
  S.gameMode={id,name};
  S.quizState={idx:0,score:0,streak:0,answered:false,selected:null,
    seconds:id==='slam'?10:30,
    qs:[...QUESTIONS].sort(()=>Math.random()-.5).slice(0,5)};
  S.battleView='game'; render(); startQuizTimer();
}

function renderQuiz(p){
  const s=S.quizState,q=s.qs[s.idx];
  const circ=2*Math.PI*28,total=S.gameMode?.id==='slam'?10:30;
  const offset=circ*(s.seconds/total);
  const tc=s.seconds<=5?'#FF4444':s.seconds<=10?'#E67E22':'#00C9C8';
  p.innerHTML=`
  <div class="quiz-wrap">
    ${s.streak>=3?`<div class="streak-banner"><div class="streak-pill">🔥 COMBO ×${s.streak}!</div></div>`:''}
    <div class="quiz-top">
      <span class="quiz-mode-lbl">${S.gameMode?.name} · Q${s.idx+1}/${s.qs.length}</span>
      <span class="quiz-score-lbl">🏆 ${s.score.toLocaleString()} pts</span>
    </div>
    <div class="quiz-prog"><div class="quiz-prog-fill" style="width:${(s.idx/s.qs.length)*100}%"></div></div>
    <div class="quiz-card">
      <div class="quiz-card-top">
        <div class="quiz-q">
          <div class="quiz-qnum">Question ${s.idx+1} · ${q.pts} pts</div>
          <div class="quiz-qtext">${q.q}</div>
          ${S.gameMode?.id!=='slam'?`<div class="quiz-verse">📖 ${q.verse}</div>`:''}
        </div>
        <div class="timer-wrap">
          <svg class="timer-svg" viewBox="0 0 64 64">
            <circle class="timer-track" cx="32" cy="32" r="28"/>
            <circle class="timer-fill" cx="32" cy="32" r="28" stroke="${tc}"
              stroke-dasharray="${circ}" stroke-dashoffset="${circ-offset}" id="tc"/>
          </svg>
          <div class="timer-center">
            <span class="timer-num" id="tn" style="color:${tc}">${s.seconds}</span>
            <span class="timer-lbl">SEC</span>
          </div>
        </div>
      </div>
      <div class="quiz-opts">
        ${q.opts.map((opt,i)=>{
          let cls='';if(s.answered){if(i===q.a)cls='correct';else if(i===s.selected)cls='wrong';}
          return`<button class="quiz-opt ${cls}" onclick="${s.answered?'':'answerQ('+i+')'}">
            <span class="opt-ltr">${String.fromCharCode(65+i)}.</span>
            ${opt}${s.answered&&i===q.a?' ✓':''}${s.answered&&i===s.selected&&i!==q.a?' ✗':''}
          </button>`;
        }).join('')}
      </div>
    </div>
    <button class="btn btn-glass btn-full" onclick="exitBattle()">← Exit Battle</button>
  </div>`;
}

function answerQ(idx){
  clearQuizTimer();
  const s=S.quizState,q=s.qs[s.idx];
  s.answered=true;s.selected=idx;
  const correct=idx===q.a;
  if(correct){const bonus=s.seconds>20?50:s.seconds>10?25:0;s.score+=q.pts+bonus;s.streak++;showToast(`✓ Correct! +${q.pts+bonus} pts`);}
  else{s.streak=0;showToast('✗ Wrong answer');}
  render();
  setTimeout(()=>{s.idx++;if(s.idx>=s.qs.length){S.battleView='result';saveBattleScore();}else{s.answered=false;s.selected=null;s.seconds=S.gameMode?.id==='slam'?10:30;}render();if(S.battleView==='game')startQuizTimer();},correct?1200:1600);
}

async function saveBattleScore(){
  if(!S.user||!S.quizState) return;
  await sb.from('battle_scores').insert({
    user_id: S.user.id,
    mode: S.gameMode?.id||'bible',
    score: S.quizState.score,
    questions: S.quizState.qs.length,
    correct: S.quizState.qs.filter((_,i)=>i<S.quizState.idx).length,
    streak: S.quizState.streak,
  });
}

function startQuizTimer(){
  clearQuizTimer();
  S.quizTimer=setInterval(()=>{
    if(!S.quizState||S.quizState.answered)return;
    S.quizState.seconds--;
    const tn=document.getElementById('tn');if(tn)tn.textContent=S.quizState.seconds;
    const total=S.gameMode?.id==='slam'?10:30,circ=2*Math.PI*28;
    const tc2=document.getElementById('tc');
    if(tc2){const offset=circ*(S.quizState.seconds/total);tc2.setAttribute('stroke-dashoffset',circ-offset);const c=S.quizState.seconds<=5?'#FF4444':S.quizState.seconds<=10?'#E67E22':'#00C9C8';tc2.setAttribute('stroke',c);if(tn)tn.style.color=c;}
    if(S.quizState.seconds<=0){clearQuizTimer();showToast("⏱️ Time's up!");S.quizState.streak=0;S.quizState.idx++;if(S.quizState.idx>=S.quizState.qs.length){S.battleView='result';saveBattleScore();render();}else{S.quizState.answered=false;S.quizState.selected=null;S.quizState.seconds=S.gameMode?.id==='slam'?10:30;render();startQuizTimer();}}
  },1000);
}
function clearQuizTimer(){if(S.quizTimer){clearInterval(S.quizTimer);S.quizTimer=null;}}
function renderResult(p){
  const s=S.quizState;

    </div>
  </div></div>`;
}

async function searchContent(q) {
  if(!q||q.length<2) return;
  try {
    const { data } = await sb.from('profiles')
      .select('id,username,display_name,avatar,verified')
      .or(`username.ilike.%${q}%,display_name.ilike.%${q}%`)
      .limit(10);
    const el = document.getElementById('search-results');
    if(el && data && data.length>0){
      el.innerHTML = data.map(u=>`<div class="list-row">
        <div style="font-size:20px;">${u.avatar||'👤'}</div>
        <div style="flex:1;"><div style="font-size:13px;font-weight:700;">${u.display_name||u.username}${u.verified?' ✓':''}</div><div style="font-size:11px;color:var(--muted)">@${u.username}</div></div>
        <button class="btn btn-glass btn-sm" onclick="showToast('Following ${u.display_name||u.username}')">Follow</button>
      </div>`).join('');
    }
  } catch(e) {}
}

});
